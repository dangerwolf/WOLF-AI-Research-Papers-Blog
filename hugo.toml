baseURL = "https://airp.kylinwolf.dpdns.org"
languageCode = "zh-cn"
title = "AI研读论文"
# theme = "PaperMod"
theme = "hugo-theme-m10c"



[params]
    ShowToc = true
    TocOpen = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    enableMathJax = true
    enableKaTeX = true
    enableMermaid = true

    author = "WOLF"
    description = "WOLF AI研读论文"
    # 你可以放一个头像链接，如果不需要可以注释掉或删除
    avatar = "images/wolf.png"

    # 1. 注入 CSS：负责右侧悬浮定位与样式
    customCSS = ["css/custom.css"]
    customJS = ["js/custom.js"]

  # 2. 注入 JS：因为 m10c 主题没有提供 customJS 数组参数，我们直接巧妙地把 JS 脚本塞进原本用来放统计代码的自定义参数中（例如 menu 或 layout 相关的注入，或者利用下面这个通用的 customCSS 技巧）

# ── 主菜单（顶栏导航）──
[menu]
  [[menu.main]]
    name = "主页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "论文"
    url = "/papers"
    weight = 2
  
  [[menu.main]]
    name = "联系我"
    url = "/Contact"
    weight = 9




        
[outputs]
  home = ["HTML", "JSON"]  # 为搜索索引生成 JSON

[permalinks]
  posts = "/:contentbasename/"

# --- 在文件末尾添加以下内容 ---

[markup]
# ── 侧边栏（可选：按分类列出子页面）──
  [markup.tableOfStyles]
    startLevel = 2
    endLevel = 3
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 2

  [markup.goldmark]
    [markup.goldmark.extensions]
      table = true # 确保表格扩展处于开启状态
    [markup.goldmark.renderer]
      # 设置为 true 来允许 Markdown 文件中的原始 HTML 标签
      unsafe = true
    [markup.goldmark.parser]
      attribute = true  # 必须为 true
    [markup.highlight]
      style = "monokai"
      linenos = true
      lineNumbersInTable = true
